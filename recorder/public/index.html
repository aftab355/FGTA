<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FGTA recorder</title>
<style>
  :root{
    --bg:#0b0716; --panel:#151030; --panel-2:#1c1640; --line:#2c2352;
    --ink:#efeaff; --muted:#b7aee0; --dim:#7d74a8; --accent:#c8ff2f; --red:#ff2d2d;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:18px;max-width:760px;margin:0 auto}
  h1{font-size:19px;letter-spacing:1px;margin:0 0 2px;font-family:'JetBrains Mono',ui-monospace,monospace}
  .sub{color:var(--dim);font-size:11px;font-family:ui-monospace,monospace;letter-spacing:1px;text-transform:uppercase}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input{flex:1;min-width:120px;background:var(--bg);border:1px solid var(--line);color:var(--ink);
    border-radius:10px;padding:11px 13px;font-family:ui-monospace,monospace;font-size:15px;
    letter-spacing:3px;text-transform:uppercase;text-align:center}
  button{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:999px;
    padding:11px 18px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit}
  button:hover{border-color:var(--accent)}
  button.go{background:var(--accent);color:#0b1400;border-color:var(--accent);font-weight:800}
  button.stop{background:transparent;border-color:rgba(255,45,45,.5);color:#ff8f8f}
  button:disabled{opacity:.45;cursor:default}
  .badge{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;
    font-family:ui-monospace,monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700}
  .badge.on{background:rgba(255,45,45,.14);border:1px solid rgba(255,45,45,.45);color:#ff9d9d}
  .badge.off{background:var(--panel-2);border:1px solid var(--line);color:var(--dim)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--red);animation:p 1.6s ease-out infinite}
  @keyframes p{0%{box-shadow:0 0 0 0 rgba(255,45,45,.6)}70%{box-shadow:0 0 0 7px rgba(255,45,45,0)}100%{box-shadow:0 0 0 0 rgba(255,45,45,0)}}
  h2{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);
    margin:0 0 10px;font-family:ui-monospace,monospace}
  .item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;
    border-bottom:1px solid rgba(255,255,255,.06);font-size:13px;min-width:0}
  .item:last-child{border-bottom:none}
  .item .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta{color:var(--dim);font-family:ui-monospace,monospace;font-size:11px;white-space:nowrap}
  a{color:var(--accent);text-decoration:none}
  .empty{color:var(--dim);font-size:12.5px}
  .log{font-family:ui-monospace,monospace;font-size:10.5px;color:var(--dim);line-height:1.75;
    max-height:190px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
  .switch{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
  .switch input{width:auto;flex:none;transform:scale(1.25);margin:0}
  .live-btn{width:100%;text-align:left;margin-top:6px}

  /* ---- multi-angle playback ----
     Same shape as the live view: one big picture, the other cameras as live
     tiles beside it. The angles are separate files (each camera recorded
     independently, and they start at different moments) so the player lines
     them up by offset and drives them as one timeline. */
  .stage{position:relative;background:#000;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .stage video{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#000}
  .stage-note{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.72);color:var(--muted);font-family:ui-monospace,monospace;font-size:12px;text-align:center;padding:16px}
  /* display:flex above outranks the browser's [hidden]{display:none}, so this
     overlay would otherwise sit on top of a camera that was running perfectly
     well — it has to opt out of its own display rule explicitly */
  .stage-note[hidden]{display:none}
  .rail{display:flex;gap:8px;margin-top:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .tile{position:relative;flex:0 0 auto;width:118px;padding:0;overflow:hidden;border-radius:10px;
    border:1px solid var(--line);background:#000;cursor:pointer}
  .tile:hover{border-color:var(--accent)}
  .tile video{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#000}
  .tile .lbl{position:absolute;left:0;right:0;bottom:0;padding:3px 6px;text-align:left;color:#fff;
    background:linear-gradient(to top,rgba(0,0,0,.86),rgba(0,0,0,0));
    font-family:ui-monospace,monospace;font-size:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tile.dim video{opacity:.25}
  .transport{display:flex;align-items:center;gap:10px;margin-top:12px}
  .transport input[type=range]{flex:1;min-width:0;letter-spacing:normal;padding:0;background:none;border:none}
  .pw-note{color:var(--dim);font-size:11px;margin-top:8px;font-family:ui-monospace,monospace;line-height:1.6}
  .session{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;
    border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer;flex-wrap:wrap}
  .session:last-child{border-bottom:none}
  .session:hover .scode{color:var(--accent)}
  .scode{font-family:ui-monospace,monospace;font-weight:700;letter-spacing:1.5px}
  /* ---- exports: things made FROM a match ---- */
  .sact{display:flex;gap:6px;flex:0 0 auto}
  .sact button{padding:6px 11px;font-size:11px}
  .job{margin-top:12px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2)}
  .job-h{display:flex;justify-content:space-between;gap:10px;font-size:12px;align-items:baseline}
  .job-msg{color:var(--dim);font-family:ui-monospace,monospace;font-size:10.5px;margin-top:5px;
    overflow-wrap:anywhere}
  .bar{height:5px;border-radius:999px;background:rgba(255,255,255,.08);margin-top:8px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);transition:width .4s ease}
  .job.failed{border-color:rgba(255,45,45,.45)}
  .job.failed .bar i{background:var(--red)}
  .tag{display:inline-block;padding:2px 7px;border-radius:999px;border:1px solid var(--line);
    font-family:ui-monospace,monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--dim)}
  .tag.reel{border-color:var(--accent);color:var(--accent)}
  .cap{color:var(--muted);font-size:12px}
</style>
</head>
<body>
  <h1>FGTA recorder</h1>
  <div class="sub" id="head">connecting…</div>

  <div class="card">
    <div class="row">
      <input id="code" placeholder="CODE" maxlength="5" autocomplete="off">
      <button class="go" id="join">record</button>
      <button class="stop" id="stop">stop</button>
    </div>
    <div class="row" style="margin-top:12px;justify-content:space-between">
      <label class="switch"><input type="checkbox" id="auto"> auto-record anything that goes live</label>
      <span id="state" class="badge off">idle</span>
    </div>
    <div id="live"></div>
    <div id="jobs"></div>
  </div>

  <div class="card">
    <h2>Recording now</h2>
    <div id="angles"><div class="empty">Nothing being recorded.</div></div>
  </div>

  <div class="card">
    <h2>Watch back</h2>
    <div id="sessions"><div class="empty">No matches recorded yet.</div></div>
    <div class="pw-note" id="ffnote"></div>
  </div>

  <div class="card" id="playerCard" hidden>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <h2 style="margin:0" id="playerTitle">Match</h2>
      <button id="closePlayer" style="padding:6px 12px">close</button>
    </div>
    <div class="stage">
      <video id="mainVid" playsinline></video>
      <div class="stage-note" id="stageNote" hidden>this camera hadn't started yet</div>
    </div>
    <div class="rail" id="playRail"></div>
    <div class="transport">
      <button id="playBtn" class="go">play</button>
      <input type="range" id="seek" min="0" max="1000" value="0">
      <span class="meta" id="clock">0:00</span>
    </div>
    <div class="pw-note" id="syncNote"></div>
  </div>

  <div class="card">
    <h2>Made from recordings</h2>
    <div id="exports"><div class="empty">Nothing yet — combine a match or cut its highlights above.</div></div>
  </div>

  <div class="card">
    <h2>All files</h2>
    <div id="files"><div class="empty">No recordings yet.</div></div>
  </div>

  <div class="card">
    <h2>Log</h2>
    <div class="log" id="log"></div>
  </div>

<script>
const $ = id => document.getElementById(id);
const mb = b => b > 1e9 ? (b/1e9).toFixed(2)+' GB' : (b/1e6).toFixed(1)+' MB';
const mmss = s => Math.floor(s/60)+'m '+String(s%60).padStart(2,'0')+'s';

async function api(p, opts){ const r = await fetch(p, opts); return r.json(); }
const post = (p, body) => api(p, {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(body||{})});

$('join').onclick = async () => {
  const code = $('code').value.trim().toUpperCase();
  if(!code) return;
  $('join').disabled = true;
  try { await post('/api/watch', {code}); } finally { $('join').disabled = false; }
  refresh();
};
$('stop').onclick = async () => { await post('/api/stop'); refresh(); };
$('auto').onchange = async e => { await post('/api/auto', {on:e.target.checked}); };
$('code').addEventListener('keydown', e => { if(e.key==='Enter') $('join').click(); });

let lastLog = '';
async function refresh(){
  let s;
  try { s = await api('/api/status'); }
  catch(e){ $('head').textContent = 'recorder offline'; return; }

  $('head').textContent = (s.watching ? 'watching ' + (s.code||'') : 'idle')
    + (s.disk ? ' · ' + s.disk.freeGB + ' GB free' : '');
  if(document.activeElement !== $('auto')) $('auto').checked = !!s.auto;

  const rec = (s.files||[]).length;
  $('state').className = 'badge ' + (rec ? 'on' : 'off');
  $('state').innerHTML = rec ? '<i class="dot"></i>recording ' + rec : 'idle';

  // live matches the recorder can see, straight from the app's own directory
  const live = (s.live||[]).filter(l => l.code !== s.code);
  $('live').innerHTML = live.length
    ? '<h2 style="margin-top:16px">Live now</h2>' + live.map(l =>
        `<button class="live-btn" data-code="${l.code}">▶ ${l.label||'Live match'} — ${l.code}${l.angles>1?' · '+l.angles+' angles':''}</button>`).join('')
    : '';
  $('live').querySelectorAll('button[data-code]').forEach(b =>
    b.onclick = async () => { await post('/api/watch', {code:b.dataset.code}); refresh(); });

  const files = s.files || [];
  const angles = s.angles || [];
  $('angles').innerHTML = files.length
    ? files.map(f => `<div class="item"><span class="n">${f.name.split('__')[1]||f.name}</span>
        <span class="meta">${mb(f.bytes)} · ${mmss(f.seconds)}</span></div>`).join('')
    : (angles.length
        ? angles.map(a => `<div class="item"><span class="n">${a.label}</span><span class="meta">${a.status}</span></div>`).join('')
        : '<div class="empty">Nothing being recorded.</div>');

  renderJobs(s.jobs);
  if(s.ffmpeg) ffmpegOk = !!s.ffmpeg.ok;

  const log = (s.log||[]).join('\n');
  if(log !== lastLog){ lastLog = log; $('log').textContent = log; $('log').scrollTop = $('log').scrollHeight; }
}

async function refreshFiles(){
  const r = await api('/api/recordings');
  $('files').innerHTML = r.items.length
    ? r.items.slice(0,40).map(f => `<div class="item">
        <a class="n" href="/rec/${encodeURIComponent(f.name)}" target="_blank">${f.name}</a>
        <span class="meta">${mb(f.bytes)}</span></div>`).join('')
    : '<div class="empty">No recordings yet.</div>';
}

/* ---------- multi-angle playback ----------
   Every camera recorded its own file, starting whenever that camera joined.
   Playback rebuilds them into one match: session time 0 is the earliest
   recording's start, each angle carries the offset it joined at, and all of
   them are driven from that single clock. Switching angle is then just a
   question of which video is on the big screen and which one you can hear —
   they are all already playing, in step, which is what makes it feel like a
   broadcast rather than a folder of clips. */
let P = null;

function fmt(s){ s=Math.max(0,Math.floor(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }

async function openSession(sess){
  closePlayer();
  P = { sess, videos:{}, t:0, playing:false, active:sess.angles[0].name, dur:sess.durationMs/1000 };
  $('playerTitle').textContent = `${sess.code} · ${new Date(sess.startedAt).toLocaleString()}`;
  $('playerCard').hidden = false;

  // one <video> per angle: the active one is the stage, the rest are tiles
  const rail = $('playRail'); rail.innerHTML = '';
  for(const a of sess.angles){
    const v = document.createElement('video');
    v.preload='auto'; v.playsInline=true; v.muted=true; v.src='/rec/'+encodeURIComponent(a.name);
    P.videos[a.name] = v;
    const tile = document.createElement('button');
    tile.className='tile'; tile.dataset.name=a.name;
    const lbl=document.createElement('span'); lbl.className='lbl'; lbl.textContent=a.label;
    tile.appendChild(v); tile.appendChild(lbl);
    tile.onclick = ()=>setActive(a.name);
    rail.appendChild(tile);
  }
  $('syncNote').textContent = sess.angles.map(a =>
    a.offsetMs > 1500 ? `${a.label} joined ${fmt(a.offsetMs/1000)} in` : `${a.label} from the start`).join(' · ');

  setActive(sess.angles[0].name);
  seekTo(0);
  P.tick = setInterval(driveClock, 250);
}

/* Move one angle to the stage. The others keep playing in their tiles, so the
   switch costs nothing — same reason the live view keeps every connection open. */
function setActive(name){
  if(!P) return;
  P.active = name;
  const main = $('mainVid');
  const rail = $('playRail');
  // put every video back in its tile, then lift the active one onto the stage
  for(const a of P.sess.angles){
    const v = P.videos[a.name];
    v.muted = (a.name !== name);
    const tile = rail.querySelector(`[data-name="${CSS.escape(a.name)}"]`);
    tile.hidden = (a.name === name);
    if(a.name === name){
      if(v.parentElement !== main.parentElement){ main.parentElement.insertBefore(v, main); }
      v.className = ''; v.style.cssText='display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#000';
    } else if(v.parentElement !== tile){
      tile.insertBefore(v, tile.firstChild);
      v.style.cssText='';
    }
  }
  main.style.display='none';   // the real stage is whichever angle's own element we lifted in
}

/* session time -> each angle's own timeline */
function seekTo(t){
  if(!P) return;
  P.t = Math.max(0, Math.min(t, P.dur));
  for(const a of P.sess.angles){
    const v = P.videos[a.name];
    const local = P.t - a.offsetMs/1000;
    if(local < 0){ try{ v.pause(); v.currentTime = 0; }catch(e){} continue; }
    if(Math.abs(v.currentTime - local) > 0.4){ try{ v.currentTime = local; }catch(e){} }
    if(P.playing) v.play().catch(()=>{});
  }
  paintClock();
}

function driveClock(){
  if(!P) return;
  if(P.playing){
    const lead = P.videos[P.active];
    const a = P.sess.angles.find(x=>x.name===P.active);
    if(lead && !lead.paused) P.t = lead.currentTime + a.offsetMs/1000;
    /* keep the off-screen angles from drifting away from the one being watched */
    for(const ang of P.sess.angles){
      if(ang.name===P.active) continue;
      const v=P.videos[ang.name], local=P.t-ang.offsetMs/1000;
      if(local<0){ if(!v.paused) v.pause(); continue; }
      if(v.paused) v.play().catch(()=>{});
      if(Math.abs(v.currentTime-local)>0.6){ try{ v.currentTime=local; }catch(e){} }
    }
    if(P.t >= P.dur) togglePlay(false);
  }
  paintClock();
}

function paintClock(){
  if(!P) return;
  $('clock').textContent = fmt(P.t)+' / '+fmt(P.dur);
  const seek=$('seek');
  if(document.activeElement!==seek) seek.value = String(Math.round((P.t/(P.dur||1))*1000));
  const a = P.sess.angles.find(x=>x.name===P.active);
  $('stageNote').hidden = !(a && P.t < a.offsetMs/1000);
  for(const ang of P.sess.angles){
    const tile=$('playRail').querySelector(`[data-name="${CSS.escape(ang.name)}"]`);
    if(tile) tile.classList.toggle('dim', P.t < ang.offsetMs/1000);
  }
}

function togglePlay(force){
  if(!P) return;
  P.playing = (force===undefined) ? !P.playing : force;
  $('playBtn').textContent = P.playing ? 'pause' : 'play';
  for(const a of P.sess.angles){
    const v=P.videos[a.name];
    if(P.playing && P.t >= a.offsetMs/1000) v.play().catch(()=>{}); else v.pause();
  }
}

function closePlayer(){
  if(P){ clearInterval(P.tick); for(const v of Object.values(P.videos)){ v.pause(); v.src=''; } }
  P=null;
  $('playerCard').hidden = true;
  $('playRail').innerHTML='';
  $('mainVid').style.display='';
}

$('playBtn').onclick = ()=>togglePlay();
$('closePlayer').onclick = closePlayer;
$('seek').oninput = e => { if(P) seekTo((e.target.value/1000)*P.dur); };
$('seek').onchange = e => { if(P) seekTo((e.target.value/1000)*P.dur); };

/* ---------- exports ----------
   A match can be turned into two other things: one combined file with every
   camera on the same timeline (which is what you send to somebody, or drop
   into an editor), and a set of highlight clips picked out of it. Both are
   ffmpeg jobs that take minutes, so both are fire-and-forget and report back
   through the job list at the top. */
let ffmpegOk = true;
async function startExport(kind, s, btn){
  const row = btn.closest('.session');
  row.querySelectorAll('button').forEach(b => b.disabled = true);
  try{
    const r = await post('/api/'+kind, {code:s.code, startedAt:s.startedAt});
    if(r && r.error) alert(r.error);
  }catch(e){ alert('could not start: '+e.message); }
  refresh();
  setTimeout(()=>row.querySelectorAll('button').forEach(b => b.disabled = false), 1500);
}

async function refreshSessions(){
  const r = await api('/api/sessions');
  $('sessions').innerHTML = r.items.length
    ? r.items.slice(0,25).map((s,i) => `<div class="session" data-i="${i}">
        <span class="n"><span class="scode">${s.code}</span> · ${s.angles.length} angle${s.angles.length===1?'':'s'}
          <span class="meta"> ${new Date(s.startedAt).toLocaleString()}</span></span>
        <span class="meta">${fmt(s.durationMs/1000)} · ${mb(s.bytes)}</span>
        <span class="sact">
          <button data-act="combine" data-i="${i}" ${ffmpegOk?'':'disabled'} title="Every camera on one timeline, side by side, as a single file that plays anywhere">one file</button>
          <button data-act="clips" data-i="${i}" ${ffmpegOk?'':'disabled'} title="Find the moments worth keeping — from the score, the crowd, and an AI look at the picture — and cut them out">highlights</button>
        </span></div>`).join('')
    : '<div class="empty">No matches recorded yet.</div>';
  $('sessions').querySelectorAll('.session').forEach(el =>
    el.onclick = e => { if(!e.target.closest('button')) openSession(r.items[+el.dataset.i]); });
  $('sessions').querySelectorAll('button[data-act]').forEach(b =>
    b.onclick = () => startExport(b.dataset.act, r.items[+b.dataset.i], b));
}

async function refreshExports(){
  const r = await api('/api/exports');
  ffmpegOk = !!(r.ffmpeg && r.ffmpeg.ok);
  $('ffnote').textContent = ffmpegOk
    ? `ffmpeg ${r.ffmpeg.version} · ${r.ffmpeg.source}${r.ffmpeg.hw?` · encoding on the GPU (${r.ffmpeg.hw})`:' · encoding on the CPU'}`
    : 'No ffmpeg found — recording is unaffected, but combining and highlights need it. Run npm install in this folder, or set FGTA_FFMPEG to your own build.';
  const kindLabel = {combined:'one file', clip:'clip', reel:'reel'};
  $('exports').innerHTML = r.items.length
    ? r.items.slice(0,40).map(f => `<div class="item">
        <span class="n"><a href="/export/${encodeURIComponent(f.name)}" target="_blank">${f.caption || f.label || f.name}</a>
          <span class="tag ${f.kind==='reel'?'reel':''}">${kindLabel[f.kind]||f.kind}</span>
          ${f.code?`<span class="meta"> ${f.code}</span>`:''}
          ${f.kind==='clip'&&!f.judged?'<span class="meta"> · not judged</span>':''}</span>
        <span class="meta">${mb(f.bytes)}</span></div>`).join('')
    : '<div class="empty">Nothing yet — combine a match or cut its highlights above.</div>';
}

function renderJobs(jobs){
  const live = (jobs||[]).filter(j => j.status==='running' || j.status==='queued'
    || (j.endedAt && Date.now()-j.endedAt < 90000));
  $('jobs').innerHTML = live.map(j => `<div class="job ${j.status==='failed'?'failed':''}">
      <div class="job-h">
        <span>${j.kind==='combine'?'Combining':'Cutting highlights'} — ${j.label}</span>
        <span class="meta">${j.status==='running'?Math.round((j.pct||0)*100)+'%':j.status}</span>
      </div>
      ${j.message?`<div class="job-msg">${j.message}</div>`:''}
      <div class="bar"><i style="width:${Math.round((j.status==='done'?1:(j.pct||0))*100)}%"></i></div>
    </div>`).join('');
}

refreshExports().then(refreshSessions);
refresh(); refreshFiles();
setInterval(refresh, 1500);
setInterval(refreshFiles, 8000);
setInterval(refreshExports, 6000);
setInterval(()=>{ if(!P) refreshSessions(); }, 8000);
</script>
</body>
</html>
